name: Release candidate checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: python scripts/build_release.py
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python scripts/build_release.py --build-engine
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-release-candidate
          path: dist/*.zip
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Resonance-release-candidate
          path: release
      - name: Publish tested candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip --clobber
          else
            gh release create "$tag" release/*.zip --target "$GITHUB_SHA" --prerelease --title "Resonance $version" --notes "Release candidate. Includes the matching modified AGPL engine and corresponding source. Read docs/SETUP.md before use. Windows live peer testing remains part of candidate evaluation."
          fi
